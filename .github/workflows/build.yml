name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - run: cd app && flutter pub get
      - run: cd app && dart format --output=none --set-exit-if-changed .
      - run: cd app && flutter analyze --no-fatal-infos
      - run: cd app && flutter test

  build-android-apk:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - run: cd app && flutter pub get
      - run: cd app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build-android-aab:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - run: cd app && flutter pub get
      - run: cd app && flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

  build-windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - run: cd app && flutter pub get
      - run: cd app && flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: app/build/windows/x64/runner/Release

  build-linux:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtk-3-dev libsecret-1-dev
      - run: cd app && flutter pub get
      - run: cd app && flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: app/build/linux/x64/release/bundle

  build-macos:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true
      - run: cd app && flutter pub get
      - run: cd app && flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: app/build/macos/Build/Products/Release/InhaleSkillAI.app
