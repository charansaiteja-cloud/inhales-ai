<script>
  // OpenFilm player controller
  const film = {
    duration: 20,
    tracks: document.querySelectorAll('section.track'),
    music: document.getElementById('music'),
    playing: false,
    currentTime: 0,
    raf: null
  };

  film.tracks.forEach(t => {
    t.style.opacity = '0';
    t.style.display = 'none';
  });

  function updateTracks(t) {
    film.tracks.forEach(tr => {
      const at = parseFloat(tr.dataset.at) || 0;
      const dur = parseFloat(tr.dataset.dur) || 0;
      const end = at + dur;
      const iframe = tr.querySelector('iframe');
      if (t >= at && t < end) {
        tr.style.display = 'block';
        tr.style.opacity = '1';
        if (iframe && iframe.contentWindow && iframe.contentWindow.film) {
          iframe.contentWindow.film.frame((t - at) / dur);
        }
      } else {
        tr.style.opacity = '0';
        tr.style.display = 'none';
      }
    });
  }

  function tick(ts) {
    if (!film.playing) return;
    film.currentTime = (ts - film.startTime) / 1000;
    if (film.currentTime >= film.duration) {
      film.currentTime = film.duration;
      film.playing = false;
      film.music.pause();
      film.music.currentTime = 0;
      updateTracks(film.currentTime);
      return;
    }
    updateTracks(film.currentTime);
    film.raf = requestAnimationFrame(tick);
  }

  film.play = () => {
    if (film.playing) return;
    film.playing = true;
    film.startTime = performance.now() - film.currentTime * 1000;
    film.music.currentTime = film.currentTime;
    film.music.play().catch(() => {});
    film.raf = requestAnimationFrame(tick);
  };

  film.pause = () => {
    film.playing = false;
    cancelAnimationFrame(film.raf);
    film.music.pause();
  };

  film.seek = (t) => {
    film.currentTime = Math.max(0, Math.min(film.duration, t));
    film.music.currentTime = film.currentTime;
    updateTracks(film.currentTime);
  };

  window.film = film;
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); film.playing ? film.pause() : film.play(); }
    if (e.code === 'ArrowLeft') film.seek(film.currentTime - 1);
    if (e.code === 'ArrowRight') film.seek(film.currentTime + 1);
    if (e.code === 'KeyR') film.seek(0);
  });

  // Auto-play on load for preview
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => film.play(), 500);
  });
</script>
